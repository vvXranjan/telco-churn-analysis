name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pytest==9.1.1

      - name: Run tests
        run: pytest -q

      - name: Check no secrets committed
        run: |
          if grep -rIl --exclude-dir=.git -E 'sk-[A-Za-z0-9]{20,}|OPENAI_API_KEY=.' . ; then
            echo "Potential secret detected" && exit 1
          fi
          echo "No secrets found"